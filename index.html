<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07101f"><title>NEON FORGE v0.2 — Machine Uprising</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a13;color:#d9faff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}#hud{position:fixed;top:0;left:0;right:0;display:flex;gap:12px;justify-content:space-between;align-items:center;padding:env(safe-area-inset-top) 14px 9px;background:linear-gradient(#050a13ee,#050a1300);font-size:12px;pointer-events:none;letter-spacing:.09em}#hud strong{color:#61ecff}#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#020613b8;backdrop-filter:blur(7px)}.panel{max-width:360px;width:86%;text-align:center;border:1px solid #41839b;padding:28px 20px;border-radius:16px;background:linear-gradient(145deg,#15273a,#07101e);box-shadow:0 0 65px #00d5ff22}.panel h1{margin:0;color:#72edff;font-size:32px;letter-spacing:.15em}.panel p{font-size:14px;line-height:1.65;color:#b6c9d8}.panel button{font:700 15px system-ui;border:1px solid #a8fcff;border-radius:7px;background:#10718b;color:white;padding:12px 30px;cursor:pointer}small{color:#89a7b7}#overlay[hidden]{display:none}</style></head>
<body><canvas id="game"></canvas><div id="hud"><span>NEON <strong>FORGE</strong></span><span id="level">SECTOR 01</span><span id="score">0 PTS</span><span id="lives">♥ ♥ ♥</span></div><div id="overlay"><div class="panel"><h1 id="title">NEON FORGE</h1><p id="message">A futuristic brick breaker inspired by classic PC arcade games.<br>Drag to steer your ship. Catch power-ups. Clear each sector.</p><button id="start">START MISSION</button><p><small>Touch, mouse, or ← → keys · Tap to launch</small></p></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const el=id=>document.getElementById(id);let W=0,H=0,dpr=1,playing=false,launched=false,level=0,score=0,lives=3,bricks=[],balls=[],drops=[],shots=[],particles=[],stars=[],last=0,laserTime=0,wideTime=0,slowTime=0,shootTimer=0,holding=false;
const paddle={x:0,y:0,w:100,h:14,target:0};let tick=0,shake=0,combo=0,sectorBanner=0;const sectorNames=['IRON FOUNDRY','PLASMA GRID','ORBITAL DOCK','REACTOR VAULT','DRONE HIVE','MACHINE CORE'];const colors=['#58dffa','#8c87ff','#ffb16a','#f47cbb','#6ff0ae','#ffd77b'];const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));const rand=(a,b)=>a+Math.random()*(b-a);
function resize(){let oldW=W;W=window.innerWidth;H=window.innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);paddle.y=H-Math.max(88,Math.min(132,H*.13));paddle.target=oldW?paddle.target*W/oldW:W/2;paddle.x=oldW?paddle.x*W/oldW:W/2;stars=Array.from({length:70},()=>({x:rand(0,W),y:rand(0,H),r:rand(.4,1.5)}));}window.addEventListener('resize',resize);resize();
function build(){sectorBanner=180;combo=0;bricks=[];drops=[];shots=[];balls=[];particles=[];laserTime=wideTime=slowTime=0;paddle.w=clamp(W*.24,74,116);const cols=W<420?8:11;const gap=4,bw=(W-26-(cols-1)*gap)/cols,bh=clamp(H*.028,17,26),top=Math.max(88,H*.16),rows=6+Math.min(level%5,3);for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){let include=false;switch(level%6){case 0:include=(r+c)%5!==0;break;case 1:include=Math.abs(c-(cols-1)/2)<=r*.66+1;break;case 2:include=(r%3!==1||c%3!==1);break;case 3:include=(c+r)%4!==0&&Math.abs(c-(cols-1)/2)>1||r<2;break;case 4:include=(c%3!==1||r%2===0);break;case 5:include=(c+r)%2===0||r===rows-1;break}if(include)bricks.push({x:13+c*(bw+gap),y:top+r*(bh+gap),w:bw,h:bh,hp:(r<2&&level>0)?2:1,max:(r<2&&level>0)?2:1,color:colors[(r+Math.floor(level/2))%colors.length],kind:level===0?'normal':((r*7+c*3+level)%13===0?'bomb':(level>=2&&(r*3+c+level)%11===0?'moving':(level>=3&&(c*5+r+level)%17===0?'phase':'normal'))),baseX:13+c*(bw+gap),phase:rand(0,6.28),vx:0});}spawnBall(false);updateHud();}
function spawnBall(launchedNow,x,y,vx,vy){balls.push({x:x??paddle.x,y:y??paddle.y-20,vx:vx??rand(-2,2),vy:vy??-5,r:6,stuck:!launchedNow});}
function updateHud(){el('level').textContent=sectorNames[level%6]+' · '+String(level+1).padStart(2,'0');el('score').textContent=score+' PTS';el('lives').textContent='♥ '.repeat(Math.max(0,lives));}
function show(title,message,button){playing=false;el('title').textContent=title;el('message').innerHTML=message;el('start').textContent=button;el('overlay').hidden=false;}
function start(){if(lives<=0){score=0;lives=3;level=0;}build();playing=true;launched=false;el('overlay').hidden=true;}
el('start').addEventListener('click',start);
function launch(){if(!playing)return;for(const b of balls)if(b.stuck){b.stuck=false;b.vx=rand(-2.7,2.7);b.vy=-Math.max(4.6,H*.008)}launched=true;}
function move(x){paddle.target=clamp(x,paddle.w/2+8,W-paddle.w/2-8);}
canvas.addEventListener('pointermove',e=>move(e.clientX));canvas.addEventListener('pointerdown',e=>{move(e.clientX);holding=true;launch()});window.addEventListener('pointerup',()=>holding=false);
const keys={};window.addEventListener('keydown',e=>{keys[e.key]=true;if([' ','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();if(e.key===' ')launch();}});window.addEventListener('keyup',e=>keys[e.key]=false);
function burst(x,y,color,n=9){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-3,3),vy:rand(-3,3),life:rand(12,28),color});}
function hitBrick(b){if(b.kind==='phase'&&Math.sin(tick*.055+b.phase)>.25)return;b.hp--;shake=Math.min(10,shake+1.6);combo++;burst(b.x+b.w/2,b.y+b.h/2,b.color,8);if(b.hp>0)return;score+=100+Math.min(combo,20)*5;if(b.kind==='bomb'){shake=13;for(const neighbor of bricks){if(neighbor!==b&&!neighbor.dead&&Math.hypot((neighbor.x+neighbor.w/2)-(b.x+b.w/2),(neighbor.y+neighbor.h/2)-(b.y+b.h/2))<Math.max(b.w*2.4,66)){neighbor.hp=1;neighbor.dead=true;score+=75;burst(neighbor.x+neighbor.w/2,neighbor.y+neighbor.h/2,'#ff9a4b',12);}}burst(b.x+b.w/2,b.y+b.h/2,'#ff9a4b',30);}if(Math.random()<.22)drops.push({x:b.x+b.w/2,y:b.y+b.h/2,type:Math.floor(rand(0,5)),vy:2.6});b.dead=true;updateHud();}
function hitBallBrick(ball,b){let nearX=clamp(ball.x,b.x,b.x+b.w),nearY=clamp(ball.y,b.y,b.y+b.h),dx=ball.x-nearX,dy=ball.y-nearY;if(dx*dx+dy*dy>ball.r*ball.r)return false;if(Math.abs(dx)>Math.abs(dy))ball.vx=(dx<0?-1:1)*Math.abs(ball.vx);else ball.vy=(dy<0?-1:1)*Math.abs(ball.vy);hitBrick(b);return true;}
function power(type){const name=['MULTIBALL','WIDE PADDLE','LASER','SLOW MOTION','SHIELD'][type];score+=50;burst(paddle.x,paddle.y,'#88f8ff',22);if(type===0){const base=balls.find(b=>!b.stuck);if(base)for(let i of [-1,1])spawnBall(true,base.x,base.y,base.vx+i*2.1,-Math.abs(base.vy));}if(type===1)wideTime=650;if(type===2)laserTime=600;if(type===3)slowTime=500;if(type===4)lives=Math.min(lives+1,5);updateHud();}
function step(dt){tick+=dt;shake=Math.max(0,shake-.4*dt);sectorBanner=Math.max(0,sectorBanner-dt);if(!playing)return;for(const b of bricks){if(b.kind==='moving'){b.x=b.baseX+Math.sin(tick*.025+b.phase)*Math.min(11,b.w*.23);}}if(keys.ArrowLeft||keys.a)paddle.target-=8*dt;if(keys.ArrowRight||keys.d)paddle.target+=8*dt;paddle.w+=( (wideTime>0?clamp(W*.37,112,170):clamp(W*.24,74,116))-paddle.w)*.12;paddle.target=clamp(paddle.target,paddle.w/2+5,W-paddle.w/2-5);paddle.x+=(paddle.target-paddle.x)*Math.min(.38*dt,1);wideTime=Math.max(0,wideTime-dt);laserTime=Math.max(0,laserTime-dt);slowTime=Math.max(0,slowTime-dt);if(laserTime>0){shootTimer-=dt;if(shootTimer<=0){for(const dir of [-1,1])shots.push({x:paddle.x+dir*paddle.w*.37,y:paddle.y-12,vy:-12});shootTimer=14;}}
for(const s of shots){s.y+=s.vy*dt;for(const b of bricks)if(!b.dead&&s.x>b.x&&s.x<b.x+b.w&&s.y>b.y&&s.y<b.y+b.h){hitBrick(b);s.dead=true;break;}if(s.y<0)s.dead=true;}shots=shots.filter(s=>!s.dead);
for(const a of balls){if(a.stuck){a.x=paddle.x;a.y=paddle.y-20;continue;}const speed=slowTime?0.67:1;a.x+=a.vx*dt*speed;a.y+=a.vy*dt*speed;if(a.x<a.r){a.x=a.r;a.vx=Math.abs(a.vx);}if(a.x>W-a.r){a.x=W-a.r;a.vx=-Math.abs(a.vx);}if(a.y<a.r+36){a.y=a.r+36;a.vy=Math.abs(a.vy);}if(a.vy>0&&a.y+a.r>=paddle.y&&a.y-a.r<=paddle.y+paddle.h&&Math.abs(a.x-paddle.x)<paddle.w/2+a.r){let norm=clamp((a.x-paddle.x)/(paddle.w/2),-1,1);a.vx=norm*5.4;a.vy=-Math.sqrt(Math.max(13,39-a.vx*a.vx));a.y=paddle.y-a.r-1;burst(a.x,a.y,'#69eeff',4);}for(const b of bricks){if(!b.dead&&hitBallBrick(a,b))break;}if(a.y>H+15)a.dead=true;}balls=balls.filter(a=>!a.dead);bricks=bricks.filter(b=>!b.dead);
for(const d of drops){d.y+=d.vy*dt;if(d.y>paddle.y-8&&d.y<paddle.y+20&&Math.abs(d.x-paddle.x)<paddle.w/2+10){power(d.type);d.dead=true;}if(d.y>H+15)d.dead=true;}drops=drops.filter(d=>!d.dead);
for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}particles=particles.filter(p=>p.life>0);
if(bricks.length===0){level++;score+=500;build();updateHud();show('SECTOR CLEARED','Sector complete. Repairs finished. Next machine online.','CONTINUE');}else if(balls.length===0){lives--;updateHud();if(lives<=0)show('MISSION FAILED','Final score: '+score+'<br>Try again and push deeper into the machine.','RETRY');else {spawnBall(false);combo=0;launched=false;}}}
function draw(){ctx.save();if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));ctx.fillStyle='#050a13';ctx.fillRect(-20,-20,W+40,H+40);const glow=ctx.createRadialGradient(W/2,H*.25,10,W/2,H*.35,H*.8);glow.addColorStop(0,'#15384a');glow.addColorStop(1,'#050a1300');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#173141';ctx.lineWidth=1;for(let x=0;x<W;x+=32){ctx.beginPath();ctx.moveTo(x,60);ctx.lineTo(x,H);ctx.stroke();}for(let y=60;y<H;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}for(const s of stars){ctx.fillStyle='#5ccaff44';ctx.fillRect(s.x,s.y,s.r,s.r);}

// Depth layers: enormous industrial gantry, cables, rotating gears and reactor light.
const zone=level%6,theme=['#ec9c50','#37ddeb','#a69eff','#fa657b','#9aec80','#eaa2f1'][zone];
ctx.save();ctx.globalAlpha=.32;ctx.strokeStyle=theme;ctx.lineWidth=2;
for(let side of [0,1]){let anchor=side?W-14:14;ctx.fillStyle='#162b36';ctx.fillRect(anchor-12,62,24,H-75);for(let yy=78;yy<H;yy+=68){ctx.beginPath();ctx.moveTo(anchor-9,yy);ctx.lineTo(anchor+9,yy+25);ctx.stroke();ctx.beginPath();ctx.moveTo(anchor+9,yy);ctx.lineTo(anchor-9,yy+25);ctx.stroke();}}
for(let g=0;g<4;g++){const gx=W*(.16+g*.23),gy=H*(.17+(g%2)*.22),r=26+g*8;ctx.save();ctx.translate(gx,gy);ctx.rotate(tick*.002*(g%2?-1:1));ctx.strokeStyle=theme;ctx.lineWidth=6;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();for(let z=0;z<10;z++){let a=z*Math.PI/5;ctx.fillStyle='#214050';ctx.fillRect(Math.cos(a)*(r-3)-5,Math.sin(a)*(r-3)-5,10,10);}ctx.beginPath();ctx.arc(0,0,r*.37,0,Math.PI*2);ctx.stroke();ctx.restore();}
ctx.fillStyle=theme+'22';ctx.fillRect(W*.19,H*.36,W*.62,H*.1);
ctx.restore();
for(const b of bricks){ctx.shadowColor=b.color;ctx.shadowBlur=9;ctx.fillStyle=b.kind==='bomb'?'#53301f':b.kind==='phase'?'#332547':'#112332';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.strokeStyle=b.color;ctx.lineWidth=1.5;ctx.strokeRect(b.x+1,b.y+1,b.w-2,b.h-2);ctx.strokeStyle='#ffffff35';ctx.beginPath();ctx.moveTo(b.x+4,b.y+b.h-3);ctx.lineTo(b.x+b.w-4,b.y+b.h-3);ctx.stroke();if(b.kind==='moving'){ctx.fillStyle='#78fbff';ctx.fillRect(b.x+b.w/2-5,b.y+b.h/2-2,10,4);}if(b.kind==='bomb'){ctx.fillStyle='#ff9c49';ctx.beginPath();ctx.arc(b.x+b.w/2,b.y+b.h/2,Math.min(6,b.h*.34),0,Math.PI*2);ctx.fill();}if(b.kind==='phase'){ctx.globalAlpha=.45+.4*Math.max(0,Math.sin(tick*.055+b.phase));}ctx.fillStyle=b.color+'77';ctx.fillRect(b.x+4,b.y+4,b.w-8,Math.min(3,b.h-6));if(b.hp>1){ctx.fillStyle='#eafaff';ctx.fillRect(b.x+b.w/2-4,b.y+b.h/2-2,8,4);}ctx.globalAlpha=1;}ctx.shadowBlur=0;
for(const d of drops){ctx.save();ctx.translate(d.x,d.y);ctx.rotate(Math.PI/4);ctx.shadowColor=colors[d.type];ctx.shadowBlur=15;ctx.fillStyle=colors[d.type];ctx.fillRect(-9,-9,18,18);ctx.restore();ctx.fillStyle='#061222';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(['M','W','L','S','+'][d.type],d.x,d.y+4);}
for(const s of shots){ctx.shadowColor='#ffae5a';ctx.shadowBlur=12;ctx.fillStyle='#ffcc65';ctx.fillRect(s.x-2,s.y-13,4,16);}ctx.save();ctx.translate(paddle.x,paddle.y);const pw=paddle.w;
ctx.shadowColor='#45eeff';ctx.shadowBlur=18;ctx.fillStyle='#172d47';ctx.strokeStyle='#7beaff';ctx.lineWidth=1.5;
ctx.beginPath();ctx.moveTo(-pw*.5,6);ctx.lineTo(-pw*.41,-5);ctx.lineTo(-pw*.22,-9);ctx.lineTo(-pw*.12,-4);ctx.lineTo(pw*.12,-4);ctx.lineTo(pw*.22,-9);ctx.lineTo(pw*.41,-5);ctx.lineTo(pw*.5,6);ctx.lineTo(pw*.24,15);ctx.lineTo(-pw*.24,15);ctx.closePath();ctx.fill();ctx.stroke();
ctx.fillStyle='#7895ac';for(let side of [-1,1]){ctx.save();ctx.scale(side,1);ctx.fillRect(pw*.28,-7,pw*.08,16);ctx.fillStyle='#ffbd67';ctx.fillRect(pw*.31,10,pw*.04,8+Math.sin(tick*.23)*4);ctx.restore();}
ctx.fillStyle='#b1f9ff';ctx.beginPath();ctx.moveTo(0,-9);ctx.lineTo(10,3);ctx.lineTo(0,11);ctx.lineTo(-10,3);ctx.closePath();ctx.fill();
ctx.fillStyle='#7ceaff';ctx.fillRect(-pw*.41,-6,12,3);ctx.fillRect(pw*.41-12,-6,12,3);ctx.restore();for(const ball of balls){ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='#eaffff';ctx.fill();}ctx.shadowBlur=0;for(const p of particles){ctx.globalAlpha=clamp(p.life/28,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3);}ctx.globalAlpha=1;if(sectorBanner>0&&playing){ctx.globalAlpha=Math.min(1,sectorBanner/40);ctx.fillStyle='#061a2cdd';ctx.fillRect(0,H*.43-30,W,78);ctx.textAlign='center';ctx.fillStyle='#baf7ff';ctx.font='bold 13px system-ui';ctx.fillText('SECTOR '+String(level+1).padStart(2,'0'),W/2,H*.43-5);ctx.font='bold 23px system-ui';ctx.fillText(sectorNames[level%6],W/2,H*.43+26);ctx.globalAlpha=1;}if(playing&&!launched){ctx.fillStyle='#c2ecf7';ctx.textAlign='center';ctx.font='13px system-ui';ctx.fillText('TAP TO LAUNCH',W/2,paddle.y+50);}ctx.restore();}
function frame(t){const dt=Math.min(2,(t-last)/16.67||1);last=t;step(dt);draw();requestAnimationFrame(frame);}build();requestAnimationFrame(frame);
})();
</script></body></html>
